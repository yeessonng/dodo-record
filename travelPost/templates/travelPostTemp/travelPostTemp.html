{% load static %}

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도도기록</title>
    <link rel="stylesheet" href="{% static 'travelPostTemp/travelPostTemp.css' %}" />
</head>
<body>
  <div class="mobile-wrapper">
    <div class="top-bar">
      <img src="{% static 'travelPostTemp/images/iconoir_nav-arrow-left.png' %}" class="back-icon" onclick="history.back()" />
      <span class="page-title">임시저장목록</span>
    </div>

    <div id="record-container"></div>
      <script>
          fetch('/travelPost/tempList/')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById("record-container");
    container.innerHTML = '';  // 초기화

    if (!data.posts || data.posts.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = "임시 저장된 기록이 없습니다.";
      container.appendChild(empty);
      return;
    }

    data.posts.forEach((record, index) => {
      const card = document.createElement("div");
      card.className = "record-card";

      const regionList = Array.isArray(record.region) ? record.region : [];
      const mainRegion = regionList.length > 0 ? regionList[0].region : "지역 없음";
      const tags = regionList.map(r => r.subregion || "").filter(Boolean);  // 빈 값 제외

      const tagHTML = `
        <span class="tag black">${mainRegion}</span>
        ${tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
      `;

      const imageSrc = Array.isArray(record.image_urls) && record.image_urls.length > 0
        ? record.image_urls[0]
        : "";

      card.innerHTML = `
        <img src="${imageSrc}" class="record-image" alt="기록 이미지" />
        <div class="record-info">
          <span class="emoji">${record.icon || ''}</span>
          <span class="record-title">${record.title || '제목 없음'}</span>
        </div>
        <div class="card-footer">
            <div class="tag-list">${tagHTML}</div>
            <div class="card-menu-toggle" onclick="toggleMenu(this)">⋯</div>
        </div>
        <div class="card-menu">
            <button class="menu-item edit" onclick="editCard(${index})">
                <img src="{% static 'travelPostTemp/images/iconoir_map-pin.svg' %}" alt="편집 아이콘" />
            <span>편집하기</span>
            </button>
            <hr />
            <button class="menu-item delete" onclick="confirmDelete(this)">
                <img src="{% static 'travelPostTemp/images/iconoir_trash.svg' %}" alt="삭제 아이콘" />
                <span>삭제하기</span>
            </button>
        </div>
      `;

      // 클릭 시 상세페이지 이동
      card.addEventListener('click', (e) => {
          if (e.target.closest('.card-menu') || e.target.closest('.card-menu-toggle')) {
              return;
          }
          window.location.href = `/travelList/region/${record.id}/detail/`;});

      container.appendChild(card);
    });
  })
              .catch(err => {
                  console.error("임시 포스트 로딩 실패:", err);
              });

          function toggleMenu(button) {
              const card = button.closest('.record-card');
              const menu = card.querySelector('.card-menu');

              if (menu.style.display === 'block') {
                  menu.style.display = 'none';
              } else {
                  document.querySelectorAll('.card-menu').forEach(m => m.style.display = 'none');
                  menu.style.display = 'block';
              }
          }

      </script>


    <div class="modal-overlay" id="delete-modal">
      <div class="modal-content">
        <img src="{% static '/travelPostTemp/images/iconoir_warning-triangle-solid.svg' %}" alt="경고" class="modal-icon" />
        <p>삭제하시겠어요?</p>
        <p>기록을 삭제하면 복구할 수 없어요!</p>
        <div class="modal-buttons">
          <button onclick="closeModal()">취소</button>
          <button onclick="deleteCard()">삭제</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
